logging:
    pattern:
        console: "[%p] %m%n%wEx"
    level:
        root: WARN
        org.apache.kafka.common.config: WARN
        org.apache.camel: WARN
        org.hibernate: WARN

gregor:
    dead-letter:
        cleanup-interval: 1d # Keep background cleanup out of routine H2 and shared-store fixtures.
        cleanup-batch-size: 100
    kafka:
        listener-concurrency: 1
        topics:
            default-partitions: 12
            replication-factor: 1
            retry-retention: ${KAFKA_RETRY_TOPIC_RETENTION:7d}
            dead-letter-retention: ${KAFKA_DEAD_LETTER_TOPIC_RETENTION:30d}
    webhook:
        tenant-id: 00000000-0000-0000-0000-000000000001
        endpoint-id: 00000000-0000-0000-0000-000000000002
        receiver-url: http://localhost:1/unreachable
        signing-secret: whsec_Z3JlZ29yLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldA==
        connection-timeout: 2s
        response-timeout: 5s
        receiver-timestamp-tolerance: 5m
        maximum-attempts: ${WEBHOOK_MAXIMUM_ATTEMPTS:4}

camel:
    main:
        auto-startup: false
    component:
        kafka:
            brokers: localhost:1
            lazy-start-producer: true
            max-poll-interval-ms: ${KAFKA_MAX_POLL_INTERVAL_MS:4500000}
            connection-max-idle-ms: ${camel.component.kafka.max-poll-interval-ms}
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
            additional-properties:
                "[apicurio.registry.url]": ${APICURIO_REGISTRY_URL:http://localhost:${SCHEMA_REGISTRY_PORT:8081}/apis/registry/v3}
                "[apicurio.registry.use-specific-avro-reader]": true
                "[apicurio.registry.auto-register]": true

spring:
    application:
        name: gregor
    datasource:
        url: jdbc:h2:mem:gregor;DB_CLOSE_DELAY=-1
        username: sa
        password:
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: none # Tests that exercise persistence override this and use PostgreSQL
    kafka:
        admin:
            auto-create: false
