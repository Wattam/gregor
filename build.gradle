plugins {
    id "java"
    id "org.springframework.boot" version "4.1.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "com.bakdata.gradle.avro" version "2.0.1"
}

version = "1.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

avro {
    stringType = "String"
    createSetters = false
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

String camelVersion = "4.23.0"
String apicurioVersion = "3.3.4"
String vertxVersion = "4.5.33"
String avroVersion = "1.12.2"
dependencyManagement {
    imports {
        mavenBom "org.apache.camel:camel-bom:${camelVersion}"
        mavenBom "org.apache.camel.springboot:camel-spring-boot-bom:${camelVersion}"
    }
}

// Declare the modules whose APIs Gregor uses. Keep modules already on the application classpath in implementation.
Map<String, List<String>> sourceDependencies = [
        implementation    : [
                "ch.qos.logback:logback-classic",
                "ch.qos.logback:logback-core",
                "com.fasterxml.jackson.core:jackson-annotations",
                "io.apicurio:apicurio-registry-avro-serde-kafka:${apicurioVersion}",
                "io.apicurio:apicurio-registry-java-sdk:${apicurioVersion}",
                "io.apicurio:apicurio-registry-java-sdk-adapter-vertx:${apicurioVersion}",
                "io.apicurio:apicurio-registry-schema-resolver:${apicurioVersion}",
                "io.apicurio:apicurio-registry-serde-common:${apicurioVersion}",
                "io.apicurio:apicurio-registry-serde-common-avro:${apicurioVersion}",
                "io.apicurio:apicurio-registry-serde-kafka-common:${apicurioVersion}",
                "io.vertx:vertx-core:${vertxVersion}",
                "jakarta.persistence:jakarta.persistence-api",
                "jakarta.validation:jakarta.validation-api",
                "org.apache.avro:avro:${avroVersion}",
                "org.apache.camel:camel-api",
                "org.apache.camel:camel-core-model",
                "org.apache.camel:camel-core-processor",
                "org.apache.camel:camel-kafka",
                "org.apache.camel:camel-kafka-common",
                "org.apache.camel:camel-mock",
                "org.apache.camel:camel-util",
                "org.apache.commons:commons-lang3",
                "org.apache.kafka:kafka-clients",
                "org.hibernate.orm:hibernate-core",
                "org.hibernate.validator:hibernate-validator",
                "org.jspecify:jspecify",
                "org.slf4j:slf4j-api",
                "org.springframework.boot:spring-boot",
                "org.springframework.boot:spring-boot-autoconfigure",
                "org.springframework.boot:spring-boot-validation",
                "org.springframework.data:spring-data-commons",
                "org.springframework.data:spring-data-jpa",
                "org.springframework.kafka:spring-kafka",
                "org.springframework:spring-beans",
                "org.springframework:spring-context",
                "org.springframework:spring-core",
                "org.springframework:spring-jdbc",
                "org.springframework:spring-tx",
                "org.springframework:spring-web",
                "org.springframework:spring-webmvc",
                "tools.jackson.core:jackson-core",
                "tools.jackson.core:jackson-databind"
        ],
        testImplementation: [
                "org.apache.camel:camel-test-spring-junit5",
                "org.assertj:assertj-core",
                "org.junit.jupiter:junit-jupiter-api",
                "org.junit.jupiter:junit-jupiter-params",
                "org.mockito:mockito-core",
                "org.springframework.boot:spring-boot-test",
                "org.springframework:spring-test"
        ]
]

dependencies {
    sourceDependencies.each { configurationName, modules ->
        modules.each { module -> add(configurationName, module) }
    }

    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-kafka"
    implementation "org.springframework.boot:spring-boot-starter-restclient"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.apache.camel.springboot:camel-spring-boot-starter"
    implementation "org.apache.camel.springboot:camel-kafka-starter"

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    runtimeOnly "org.postgresql:postgresql"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"

    testCompileOnly "org.projectlombok:lombok"
    testAnnotationProcessor "org.projectlombok:lombok"

    testRuntimeOnly "com.h2database:h2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    mockitoAgent("org.mockito:mockito-core") {
        transitive = false
    }
}

// Remove transitive paths to those modules without excluding the direct declarations.
["implementation", "compileOnly", "runtimeOnly", "testImplementation", "testCompileOnly", "testRuntimeOnly"].each { configurationName ->
    List<String> modules = sourceDependencies.implementation
    if (configurationName.startsWith("test")) {
        modules += sourceDependencies.testImplementation
    }
    configurations.named(configurationName) {
        dependencies.withType(ExternalModuleDependency).configureEach { dependency ->
            modules.each { notation ->
                String[] coordinates = notation.split(":")
                if (dependency.group != coordinates[0] || dependency.name != coordinates[1]) {
                    dependency.exclude(group: coordinates[0], module: coordinates[1])
                }
            }
        }
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
    jvmArgs("-Xshare:off", "-javaagent:${configurations.mockitoAgent.asPath}")
}
