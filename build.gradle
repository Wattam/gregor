plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.bakdata.gradle.avro' version '2.0.0'
}

group = ''
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

avro {
    stringType = "String"
    createSetters = false
}

repositories {
    mavenCentral()
}

// Override Spring Boot's managed versions for the Apicurio client dependency chain.
ext['netty.version'] = '4.2.21.Final'
ext['commons-codec.version'] = '1.23.0'

dependencyManagement {
    imports {
        mavenBom 'org.apache.camel.springboot:camel-spring-boot-bom:4.21.0'
    }
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-kafka-starter'
    implementation 'io.apicurio:apicurio-registry-avro-serde-kafka:3.3.4'
    implementation platform('io.vertx:vertx-dependencies:4.5.36')
    implementation 'io.vertx:vertx-core'
    implementation 'org.apache.avro:avro:1.12.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.apache.camel:camel-test-spring-junit5:4.21.0'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs("-Xshare:off", "-javaagent:${configurations.mockitoAgent.asPath}")
}
