plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.bakdata.gradle.avro' version '2.0.1'
}

group = ''
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

avro {
    stringType = "String"
    createSetters = false
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

String apicurioVersion = '3.3.4'
String camelVersion = '4.23.0'
dependencyManagement {
    imports {
        mavenBom "org.apache.camel:camel-bom:${camelVersion}"
        mavenBom "org.apache.camel.springboot:camel-spring-boot-bom:${camelVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-kafka-starter'
    implementation "io.apicurio:apicurio-registry-avro-serde-kafka:${apicurioVersion}"
    implementation 'org.apache.avro:avro'
    implementation 'io.vertx:vertx-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.apache.camel:camel-test-spring-junit5'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs("-Xshare:off", "-javaagent:${configurations.mockitoAgent.asPath}")
}
